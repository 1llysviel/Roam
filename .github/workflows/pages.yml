# 推送到 main：校验 + 测试 → 引用部署模板。只使用内置 GITHUB_TOKEN，不需要任何 key。
name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run validate
      - run: npm test

  deploy:
    needs: verify
    uses: ./.github/workflows/_deploy-pages.yml
